<div>
    <h1
        class="pl-5 mb-5"
    >
        {{ dados.titulo }}
    </h1>

    {% if not dados %}
        <h4
            class="pl-5"
        >
            Não foram encontrados dados.
        </h4>
    {% else %}
        <canvas
            id="container_{{dados.id}}"
            style="
                width: 100%;
                height: 400px;
            ">
        </canvas>
    {% endif %}
</div>
<script>
    function getRandomColor() {
      let r = Math.floor(Math.random() * 256);
      let g = Math.floor(Math.random() * 256);
      let b = Math.floor(Math.random() * 256);
      return `rgba(${r}, ${g}, ${b}, 0.2)`;
    }

    function getLast30Days() {
      const today = new Date();
      const last90Days = [];

      for (let i = 0; i < 30; i++) {
          const date = new Date(today.getTime() - (i * 24 * 60 * 60 * 1000));
          const day = date.getDate();
          const month = date.toLocaleString('default', { month: 'short' });
          last90Days.push(`${day} ${month}`);
      }

      return last90Days.reverse();
    }

    const ctx_{{dados.id}} = document.getElementById('container_{{dados.id}}');
    const chartData_{{dados.id}} = {{ dados|safe }};
    const subtitulo_{{dados.id}} = '{{ dados.subtitulo|safe }}';

    if(
        ctx_{{dados.id}} &&
        chartData_{{dados.id}} &&
        subtitulo_{{dados.id}}
    ){
        new Chart(ctx_{{dados.id}}, {
                type: 'line',
                data: {
                    labels: getLast30Days(),
                    datasets: [{
                        label: subtitulo_{{dados.id}},
                        data: chartData_{{dados.id}}.data,
                        fill: false,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            }
        );
    }
  </script>
